name: CI

on:
  push:
    branches: [ main, 'v*', 'release/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit
      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Unit Tests - Node ${{ matrix.node-version }})" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true


  integration-tests:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: krusch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/krusch
        run: npm run migrate
      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/krusch
        run: |
          for f in test/integration/*.test.js; do
            echo "::group::Running $f"
            node --test "$f" || { echo "::error file=$f::Integration test failed in $f"; exit 1; }
            echo "::endgroup::"
          done
      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Integration Tests - PostgreSQL)" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true


  typecheck:
    name: Typecheck & Packaging Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - name: Verify Publish Dry Run
        run: npm pack --dry-run
      - name: Instant Failure Push Notification
        if: failure()
        run: |
          curl -s -X POST \
            -H "Title: 🚨 CI Failure: ${{ github.repository }} (Typecheck & Pack)" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light,x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Run #${{ github.run_number }} failed on ${{ github.ref_name }}. Commit: ${{ github.sha }} by ${{ github.actor }}." \
            https://ntfy.sh/krusch-ci-alerts || true

