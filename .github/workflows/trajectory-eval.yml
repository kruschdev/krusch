name: Trajectory Eval CI Gate

on:
  push:
    branches: [ main, 'v*', 'release/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  trajectory-eval-gate:
    name: Golden Trajectory DAG Gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [ 20.x, 22.x ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Replay 100 Golden Trajectories against DAG Invariants
        run: node bin/krusch.js eval-trajectories --strict
